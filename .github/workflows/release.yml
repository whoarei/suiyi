name: Windows and Android release

on:
  push:
    tags:
      - 'v*'
  # Manual runs validate the build and produce artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust and Tauri CLI
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          npm ci --ignore-scripts

      - name: Determine package version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
              throw 'Release tags must use vX.Y.Z or vX.Y.Z-prerelease (for example v0.1.0-rc.1).'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run checks and package installer and portable app
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify install, in-place upgrade and uninstall
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts -Directory -Filter 'package-*')
          if ($packages.Count -ne 1) { throw 'Expected one clean package directory.' }
          ./scripts/test-installer.ps1 -AppDirectory (Join-Path $packages[0].FullName 'Suiyi')

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*-setup.exe
            artifacts/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-android:
    name: Check and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and assemble release APK
        run: ./gradlew --no-daemon --console=plain :app:lintDebug :app:assembleRelease

      - name: Sign and verify Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS || 'suiyi-android' }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Set the repository Actions secret $name before signing Android builds."
            }
          }
          $keystore = mktemp (Join-Path $env:RUNNER_TEMP 'suiyi-android.XXXXXX')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a temporary Android keystore file.' }
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            Remove-Item Env:ANDROID_KEYSTORE_BASE64
            $keyPasswordEnv = if ($env:ANDROID_KEY_PASSWORD) { 'ANDROID_KEY_PASSWORD' } else { 'ANDROID_KEYSTORE_PASSWORD' }
            ./sign-apk.ps1 -Keystore $keystore -KeyAlias $env:ANDROID_KEY_ALIAS -KeyPasswordEnv $keyPasswordEnv
          } finally {
            Remove-Item -LiteralPath $keystore -Force
          }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            artifacts/android/*-android.apk
            artifacts/android/*-android.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: release-assets

      - name: Verify package checksums
        working-directory: release-assets
        run: sha256sum --check --strict *.sha256

      - name: Create release and attach Windows and Android packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/*.exe release-assets/*.zip release-assets/*.apk release-assets/*.sha256 \
            --verify-tag --title "随译 $RELEASE_TAG" --generate-notes "${options[@]}"
