<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>通用输入框回填测试</title>
<style>body{font:16px "Segoe UI","Microsoft YaHei",sans-serif;max-width:820px;margin:30px auto;padding:20px;color:#243b2c;background:#f5f8f6}label{display:block;margin:20px 0 8px}textarea,input,[contenteditable]{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #a3b9ab;border-radius:6px;background:white;color:inherit}textarea,[contenteditable]{min-height:100px}button{margin-top:20px;padding:10px 20px}h1{font-size:24px}p{color:#63746a}</style>
<h1>浏览器输入框回填测试</h1><p>本页没有提交或网络功能。先聚焦输入位置，再按 Ctrl+Alt+T。</p>
<label for="plain">普通文本输入框</label><input id="plain" aria-label="普通文本输入框">
<label for="multiline">多行输入框</label><textarea id="multiline" aria-label="多行输入框"></textarea>
<label id="rich-label">富文本输入框</label><div id="rich" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="rich-label"></div>
<label for="readonly">只读输入框</label><input id="readonly" aria-label="只读输入框" readonly value="只读测试文字">
<label for="password">密码输入框（不填写真实密码）</label><input id="password" type="password" aria-label="密码测试输入框">
<button type="button">普通按钮</button>
</html>
