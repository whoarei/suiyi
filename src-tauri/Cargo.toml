[package]
name = "suiyi"
version = "1.0.4"
description = "Translate selected text in place"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "TranslationFloat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "fs", "io-util"] }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
semver = "1"
httpdate = "1"
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
